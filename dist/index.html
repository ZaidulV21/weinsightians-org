<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Per-page titles, descriptions, canonicals and OG tags are set by
         react-helmet-async. What is here is only the pre-hydration default,
         so a crawler that does not run JavaScript still sees correct signals
         for the homepage. -->
    <title>We Insightians | Web Design, Development &amp; Digital Solutions</title>
    <meta
      name="description"
      content="We Insightians is a digital agency in Lucknow building websites, brands and digital products. Web design, development, UI/UX, SEO and marketing under one roof."
    />
    <link rel="canonical" href="https://weinsightian.tech/" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="We Insightians" />
    <meta property="og:title" content="We Insightians | Web Design, Development &amp; Digital Solutions" />
    <meta
      property="og:description"
      content="We design and build digital experiences that help ambitious businesses look better, perform better and grow."
    />
    <meta property="og:url" content="https://weinsightian.tech/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- public/ is served from the web root, so asset paths are /img/... and
         never /public/img/... -->
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/img/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/img/site.webmanifest" />
    <script type="module" crossorigin src="/assets/index-DrbLAGuF.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Ctoq2aaQ.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
